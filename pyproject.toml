[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-eight-step-analysis"
version = "0.1.0"
description = "A股全行业、可审计、版本冻结的八步财报分析系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "PyMuPDF>=1.24",
  "httpx>=0.27",
  "duckdb>=1.1",
]

[project.optional-dependencies]
sources = [
  "akshare>=1.17",
  "baostock>=0.8.9",
]
tushare = [
  "tushare>=1.4",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
ashare-analysis = "analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
