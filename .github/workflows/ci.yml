name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_method_library.py
      - run: python scripts/validate_golden_samples.py
      - run: python scripts/validate_governance_registry.py --questions config/data_sources/governance_management_questions.v1.json --query-pack config/data_sources/governance_management_query_pack.v1.json --require-plan-traceability
      - run: python -m pytest tests/governance -q
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
