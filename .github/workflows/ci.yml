name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,research]"
      - run: python scripts/validate_method_library.py
      - run: python scripts/validate_golden_samples.py
      - name: Validate current acquisition source registry
        run: >-
          python scripts/validate_source_registry.py
          --registry config/data_sources/business_model_sources.v1.11.json
          --questions config/data_sources/business_model_questions.v1.json
          --expect-business-model-v1 4
          --require-plan-traceability
      - name: Validate direct empty, historical HTML and IPO registry compatibility
        run: |
          for version in 1.4 1.5 1.6 1.7 1.8 1.9 1.10; do
            python scripts/validate_source_registry.py --registry config/data_sources/business_model_sources.v${version}.json --expect-business-model-v1 4 --require-plan-traceability
          done
      - name: Validate SSE schema-approved acquisition source registry compatibility
        run: >-
          python scripts/validate_source_registry.py
          --registry config/data_sources/business_model_sources.v1.3.json
          --questions config/data_sources/business_model_questions.v1.json
          --expect-business-model-v1 4
          --require-plan-traceability
      - name: Validate policy-approved acquisition source registry compatibility
        run: >-
          python scripts/validate_source_registry.py
          --registry config/data_sources/business_model_sources.v1.2.json
          --questions config/data_sources/business_model_questions.v1.json
          --expect-business-model-v1 4
          --require-plan-traceability
      - name: Validate reviewed acquisition source registry compatibility
        run: >-
          python scripts/validate_source_registry.py
          --registry config/data_sources/business_model_sources.v1.1.json
          --questions config/data_sources/business_model_questions.v1.json
          --expect-business-model-v1 4
          --require-plan-traceability
      - name: Validate initial acquisition source registry compatibility
        run: >-
          python scripts/validate_source_registry.py
          --registry config/data_sources/business_model_sources.v1.json
          --questions config/data_sources/business_model_questions.v1.json
          --expect-business-model-v1 4
          --require-plan-traceability
      - name: Validate acquisition golden manifest structure
        run: python scripts/validate_acquisition_golden.py
      - name: Run offline acquisition contract tests
        run: >-
          python -m pytest -q -k
          "acquisition or raw_resource or evidence_manifest or source_candidate or
          snapshot_integrity or discovery_snapshot or cross_process_source_gate or
          legacy_snapshot"
      - run: python scripts/validate_governance_registry.py --questions config/data_sources/governance_management_questions.v1.json --query-pack config/data_sources/governance_management_query_pack.v1.json --require-plan-traceability
      - run: python -m pytest tests/governance -q
      - name: Run default regression suite (deferred knowledge release gate excluded)
        run: python -m pytest -m "not knowledge_release"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
