schema: spec-driven

context: |
  Language: Chinese (Simplified)
  All artifacts must be written in Chinese (Simplified).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: AstraValue, an audit-first A-share eight-step financial analysis and valuation workbench.
  Authority boundaries: 计划.md owns long-term product goals and business invariants; docs/methodology/ and config/methods/ own finance methodology and executable rules; OpenSpec owns one software change's proposal, behavioral contract, design, and tasks; 阶段日志.md owns actual test runs, online sync evidence, report versions, and trust boundaries.
  Existing methodology files marked content_status: skeleton are not validated finance methodology. OpenSpec must link to them, never silently promote them to complete.
  Never place tokens, credentials, licensed datasets, raw announcements, databases, browser profiles, or generated reports in OpenSpec artifacts or Git.
  Separate automated tests, real online sample checks, and manual golden-sample acceptance. Passing one category never implies the others passed.
  OpenSpec verify is advisory and never replaces strict validation, project tests, data-consistency checks, real samples, or manual acceptance.

rules:
  proposal:
    - Include Why, scope, Non-goals, affected layers, migration or compatibility impact, and explicit acceptance boundaries.
    - Link existing authoritative project documents instead of copying their content or creating a second methodology or stage log.
    - For data or valuation changes, identify point-in-time, source independence, licensing, revision, missing-data, and future-leakage risks.
  specs:
    - Define observable behavior and failure or degradation behavior; every requirement MUST have testable WHEN/THEN scenarios.
    - Financial facts and derived values MUST retain source, available_at, formula or method version, snapshot identity, and evidence lineage where applicable.
    - Cover immutability of historical reports and snapshots, conflicting sources, missing values, loss periods, suspensions, corrections, and out-of-order inputs when relevant.
  design:
    - Record data-model, storage-migration, API, report, export, frontend, test, rollback, and backward-compatibility decisions for every affected layer.
    - Explain alternatives and why the selected approach preserves auditability and deterministic recomputation.
  tasks:
    - Keep each checkbox small enough for one focused implementation session and state its verification command or observable result.
    - Include applicable method-library validation, pytest, frontend build or tests, SQLite-DuckDB-Parquet consistency, real online samples, and manual golden-sample status as separate gates.

operations:
  apply:
    guidance:
      - Preserve unrelated user changes and ignored local research data; never force-add ignored files.
      - Implement against the approved specs and design, add or update tests with behavior changes, and record honest evidence boundaries.
  archive:
    guidance:
      - Archive only after strict OpenSpec validation, applicable automated gates, and explicit recording of unresolved real-data or manual acceptance status.
      - Update 阶段日志.md only with checks and evidence actually observed; never infer successful online or golden-sample validation.
